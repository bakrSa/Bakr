<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BAKR Admin</title><link rel="stylesheet" href="/assets/site.css"><link rel="stylesheet" href="/assets/admin.css"><script defer src="/assets/admin.js"></script></head><body><header><div class="nav"><a class="brand" href="/"><span class="brand-logo"><img src="/assets/brand/bakr-logo.jpg" alt="" width="840" height="449"></span><span class="brand-name">BAKR</span></a><div class="tools"><button id="language">English</button><a class="button" href="/auth/logout" data-en="Sign out" data-ar="خروج">خروج</a></div></div></header><main><h1 data-en="BAKR editor" data-ar="لوحة تحكم BAKR">لوحة تحكم BAKR</h1><div id="login" class="panel hidden"><p data-en="Sign in with your authorized GitHub account." data-ar="سجّل الدخول بحساب GitHub المصرح له."></p><a class="button primary" href="/auth/login" data-en="Sign in with GitHub" data-ar="تسجيل الدخول عبر GitHub"></a></div><div id="editor" class="hidden"><div class="panel"><h2 data-en="Game pages" data-ar="صفحات الألعاب"></h2><label><span data-en="Game" data-ar="اللعبة"></span><select id="game"></select></label><label><span data-en="Name" data-ar="الاسم"></span><input id="name"></label><label><span data-en="Image URL" data-ar="رابط الصورة"></span><input id="image" dir="ltr"></label><label><span data-en="Upload image (PNG, JPEG, WebP; 1 MB)" data-ar="رفع صورة (PNG، JPEG، WebP؛ 1 ميجابايت)"></span><input id="upload" type="file" accept="image/png,image/jpeg,image/webp"></label><button id="browse" data-en="Browse uploaded images" data-ar="تصفح الصور المرفوعة"></button><div id="media"></div><label><span data-en="Products (one per line)" data-ar="المنتجات (سطر لكل منتج)"></span><textarea id="products"></textarea></label><label><span data-en="English note" data-ar="ملاحظة بالإنجليزية"></span><input id="noteEn" dir="ltr"></label><label><span data-en="Arabic note" data-ar="ملاحظة بالعربية"></span><input id="noteAr" dir="rtl"></label></div><div class="panel"><h2 data-en="Guides and solutions" data-ar="الأدلة والحلول"></h2><button id="newGuide" data-en="Create guide" data-ar="إنشاء دليل"></button><label><span data-en="Guide" data-ar="الدليل"></span><select id="guide"></select></label><label><span data-en="Guide name" data-ar="اسم الدليل"></span><input id="guideName"></label><label><span data-en="Associated game" data-ar="اللعبة المرتبطة"></span><select id="guideGame"></select></label><label><span data-en="Section" data-ar="القسم"></span><select id="section"></select></label><button id="newSection" data-en="Add section" data-ar="إضافة قسم"></button><label><span data-en="Section title" data-ar="عنوان القسم"></span><input id="sectionTitle"></label><label><span data-en="Section HTML" data-ar="محتوى القسم HTML"></span><textarea id="sectionHtml" spellcheck="false"></textarea></label></div><div class="actions"><button id="save" class="primary" data-en="Save and publish" data-ar="حفظ ونشر"></button><button id="export" data-en="Export draft" data-ar="تصدير المسودة"></button><button id="reload" data-en="Reload" data-ar="إعادة تحميل"></button></div></div><p id="status" role="status" aria-live="polite"></p></main></body></html>

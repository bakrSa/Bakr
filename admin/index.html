<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BAKR Admin</title><link rel="stylesheet" href="/assets/site.css"><style>main{max-width:900px;margin:30px auto;padding:20px}label{display:block;margin-top:16px}input,select,textarea{display:block;width:100%;padding:12px;background:#111c15;color:white;border:1px solid #365440;border-radius:8px}textarea{min-height:230px;direction:ltr}.panel{padding:20px;border:1px solid #365440;border-radius:12px;margin:20px 0}.hidden{display:none}h1{font-size:42px}</style></head><body><header><div class="nav"><a class="brand" href="/">BAKR<span>↗</span></a><nav><a href="/">الرئيسية</a></nav><a class="button" href="/auth/logout">خروج</a></div></header><main><h1>لوحة تحكم BAKR</h1><div id="login" class="panel hidden"><p>سجّل الدخول بحساب GitHub المصرح له.</p><a class="button primary" href="/auth/login">تسجيل الدخول عبر GitHub</a></div><div id="editor" class="hidden"><div class="panel"><h2>الألعاب</h2><label>اللعبة<select id="game"></select></label><label>الاسم<input id="name"></label><label>رابط الصورة<input id="image"></label><label>المنتجات (سطر لكل منتج)<textarea id="products"></textarea></label></div><div class="panel"><h2>الأدلة وروابط التحميل</h2><label>الدليل<select id="guide"></select></label><label>اسم الدليل<input id="guideName"></label><label>القسم<select id="section"></select></label><label>عنوان القسم<input id="sectionTitle"></label><label>محتوى القسم HTML<textarea id="sectionHtml"></textarea></label></div><button id="save" class="primary">حفظ ونشر</button> <button id="reload">إعادة تحميل</button></div><p id="status" role="status"></p></main><script>
const $=id=>document.getElementById(id);let data,sha,gi=0,di=0,si=0;
function options(id,items,fn){$(id).replaceChildren();items.forEach((x,i)=>{let o=document.createElement("option");o.value=i;o.textContent=fn(x);$(id).append(o)})}
function showGame(){let g=data.games[gi];$("name").value=g.name;$("image").value=g.image||"";$("products").value=g.products.join("\n")}
function saveGame(){let g=data.games[gi];g.name=$("name").value;g.image=$("image").value;g.products=$("products").value.split("\n").map(s=>s.trim()).filter(Boolean)}
function showSection(){let s=data.guides[di].sections[si];$("sectionTitle").disabled=$("sectionHtml").disabled=!s;$("sectionTitle").value=s?.title||"";$("sectionHtml").value=s?.html||""}
function saveSection(){let s=data.guides[di].sections[si];if(!s)return;s.title=$("sectionTitle").value;s.html=$("sectionHtml").value}
function showGuide(){options("section",data.guides[di].sections,s=>s.title);si=0;$("guideName").value=data.guides[di].name;showSection()}
function saveGuide(){data.guides[di].name=$("guideName").value;saveSection()}
$("game").onchange=()=>{saveGame();gi=+$("game").value;showGame()};
$("guide").onchange=()=>{saveGuide();di=+$("guide").value;showGuide()};
$("section").onchange=()=>{saveSection();si=+$("section").value;showSection()};
async function load(){try{let r=await fetch("/api/admin",{cache:"no-store"});if(r.status===401){$("login").classList.remove("hidden");$("editor").classList.add("hidden");return}let j=await r.json();if(!r.ok)throw Error(j.error);data=j.catalog;sha=j.sha;gi=di=si=0;options("game",data.games,g=>g.name);options("guide",data.guides,g=>g.name);showGame();showGuide();$("editor").classList.remove("hidden");$("login").classList.add("hidden");$("status").textContent="متصل: "+j.login}catch(e){$("status").textContent="خطأ: "+e.message}}
$("reload").onclick=()=>{if(confirm("تجاهل التغييرات؟"))load()};
$("save").onclick=async()=>{saveGame();saveGuide();$("save").disabled=true;$("status").textContent="جاري الحفظ";try{let r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sha,catalog:data})});let j=await r.json();if(!r.ok)throw Error(r.status===409?"تغيّر المحتوى في GitHub. احتفظ بتعديلاتك ثم أعد التحميل لتجنب الكتابة فوق تغييرات أخرى.":j.error);sha=j.sha;$("status").textContent="تم الحفظ في GitHub. النشر عبر Cloudflare قيد الانتظار: "+j.commit}catch(e){$("status").textContent="فشل: "+e.message}finally{$("save").disabled=false}};
load();
</script></body></html>

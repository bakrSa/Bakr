<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BAKR — Owner Login</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#173824,#090c0e 60%);color:#eef8f1;font:16px system-ui}main{width:min(390px,calc(100% - 48px));background:#111916;border:1px solid #2a4033;border-radius:20px;padding:32px}h1{text-align:center;letter-spacing:3px}h1 span{color:#74f0a0}p{text-align:center;color:#a2b3aa}label{display:block;margin:18px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;background:#0b1210;border:1px solid #385343;color:white;font:inherit}button{width:100%;padding:14px;margin-top:24px;border:0;border-radius:10px;background:#74f0a0;color:#07140a;font-weight:800;font:inherit;cursor:pointer}#msg{min-height:1.4em;color:#ff9e9e}</style></head><body><main><h1>BAKR<span>.</span></h1><p>Owner sign in</p><form id="form"><label for="user">Username</label><input id="user" autocomplete="username" required><label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password" required><button>Sign in</button></form><p id="msg" role="status"></p></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Signing in…';try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.getElementById('user').value,password:document.getElementById('pass').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Sign in failed');location.href='/admin/'}catch(err){msg.textContent=err.message}}</script></body></html>
